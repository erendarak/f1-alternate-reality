[project]
name = "f1ar"
version = "0.0.1"
description = "F1 Alternate Reality — living championship simulator (pausable, persistent, forkable race worlds with profile-conditioned AI strategists)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "fastf1>=3.8.3",
    "gymnasium>=1.4.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=2.3.3",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
# M5 training stack (D-040): PyTorch (CUDA wheels) + MaskablePPO. Only training needs it; a
# trained policy runs without torch (numpy export, f1ar.training.policy_registry).
train = [
    "torch>=2.7",
    "stable-baselines3>=2.6",
    "sb3-contrib>=2.6",
]

[tool.uv]
default-groups = ["dev", "train"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/f1ar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m \"not network\""
markers = [
    "network: test needs internet access (opt-in, not run by default in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "tests", "scripts"]
# Pseudocode blocks in the master plan are illustrative; don't reformat the source document.
extend-exclude = ["F1_ALTERNATE_REALITY_MASTER_PLAN.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["f1ar", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
files = ["backend/src/f1ar", "scripts", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastf1", "fastf1.*", "racesim", "racesim.*", "scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true  # untyped third-party (racesim: external research probe only)

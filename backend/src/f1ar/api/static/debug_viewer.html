<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1AR Debug Viewer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #e6e8eb; --muted: #8b93a1;
    --track: #3a404c; --track-edge: #5a6272; --accent: #e10600; --ok: #3ccf91; --warn: #f5b041; --hist: #6bc2ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, Segoe UI, sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 390px; height: 100vh; }
  .stage { position: relative; min-width: 0; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  .badge { position: absolute; left: 12px; top: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
  .badge b { color: var(--warn); font-weight: 600; letter-spacing: .04em; }
  .badge b.hist { color: var(--hist); }
  .camera { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
            background: rgba(23,26,33,.92); border: 1px solid var(--line); border-radius: 8px; padding: 6px; }
  .camera .label { color: var(--muted); font-size: 12px; padding: 0 4px; min-width: 150px; }
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 0 6px; letter-spacing: .05em; }
  .status { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); }
  .status span b { color: var(--text); font-variant-numeric: tabular-nums; }
  .pill { padding: 1px 7px; border-radius: 9px; font-weight: 600; font-size: 11px; }
  .pill.RUNNING { background: #123d2c; color: var(--ok); }
  .pill.PAUSED { background: #3d2f12; color: var(--warn); }
  .pill.CREATED, .pill.COMPLETED { background: #2a2f3a; color: var(--text); }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
  .break { flex-basis: 100%; height: 0; }
  button { background: #222733; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover { border-color: #49505e; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.on { outline: 2px solid #c9ced6; }
  input[type=range] { flex: 1; min-width: 140px; }
  .tower { overflow: auto; flex: 1; min-height: 0; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 500; text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 4px 6px; border-bottom: 1px solid #1f232c; white-space: nowrap; }
  tr { cursor: pointer; }
  tr.sel td { background: #232836; }
  tr.out td { color: var(--muted); }
  .chip { display: inline-block; width: 4px; height: 14px; border-radius: 2px; vertical-align: -2px; margin-right: 6px; }
  .tyre { display: inline-block; width: 18px; height: 18px; line-height: 14px; text-align: center; border-radius: 50%; border: 2px solid #888; font-weight: 700; font-size: 10px; }
  .tyre.SOFT { border-color: #e8002d; } .tyre.MEDIUM { border-color: #ffd12e; } .tyre.HARD { border-color: #f0f0f0; }
  .tyre.INTERMEDIATE { border-color: #43b047; } .tyre.WET { border-color: #0067ad; }
  .note { font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 4px; padding: 0 4px; }
  .mode { font-size: 11px; color: var(--muted); }
  .mode.PUSH { color: #ff6b6b; } .mode.CONSERVE { color: #6bc2ff; } .mode.pit { color: var(--warn); font-weight: 600; }
  .driverbox { padding: 10px 14px; border-top: 1px solid var(--line); }
  .driverbox .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .log { max-height: 130px; overflow: auto; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .msg { color: var(--warn); min-height: 18px; padding: 0 14px 8px; font-size: 12px; }
  footer { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
  .sim-only[hidden], .replay-only[hidden] { display: none !important; }
  @media (max-width: 900px) { .app { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="map"></canvas>
    <div class="badge" id="badge"><b>DEBUG VIEWER</b> · read-only view of backend state</div>
    <div class="camera">
      <button id="camFit" title="Whole track (Esc / 0)">Fit</button>
      <button id="camOut" title="Zoom out (-)">−</button>
      <button id="camIn" title="Zoom in (+)">+</button>
      <button id="camFollow" title="Lock the camera on the selected driver (F)">Follow</button>
      <button id="camBattle" title="Lock + zoom on the selected driver (B, or double-click a car)">Battle cam</button>
      <span class="label" id="camLabel">Camera: whole track</span>
    </div>
  </div>
  <aside>
    <header>
      <h1 id="title">MONZA 2024</h1>
      <div class="status">
        <span id="pill" class="pill CREATED">CREATED</span>
        <span>Lap <b id="lap">–</b></span>
        <span id="clockLabel">Sim <b id="clock">0:00.0</b></span>
        <span class="sim-only">Tick <b id="tick">0</b></span>
        <span>x<b id="speed">1</b></span>
        <span class="sim-only">Seed <b id="seed">–</b></span>
      </div>
    </header>
    <div class="controls">
      <button id="play" class="primary">Start</button>
      <button data-step="1" title="Right arrow">Step tick</button>
      <button data-step="168" title="Shift + Right arrow">Step ~lap</button>
      <span class="break"></span>
      <span id="speeds"></span>
      <button id="save" class="sim-only">Save</button>
      <span class="break sim-only"></span>
      <button id="restart" class="sim-only" title="Same seed: the identical race again">Restart (same seed)</button>
      <button id="newrace" class="sim-only" title="Fresh random seed: a different race">New race</button>
      <span class="break replay-only" hidden></span>
      <span class="replay-only" hidden style="color:var(--muted)">Go to lap</span>
      <input class="replay-only" hidden id="seek" type="range" min="1" max="53" value="1">
      <b class="replay-only" hidden id="seekLabel">1</b>
    </div>
    <div class="msg" id="msg"></div>
    <div class="tower">
      <table>
        <thead><tr><th>P</th><th>Driver</th><th>Gap</th><th>Lap</th><th>Tyre</th><th class="sim-only" title="Pit stops made">Stops</th><th id="modeHead">Mode</th><th>Last lap</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="driverbox sim-only">
      <div class="row"><span id="selname" style="min-width:90px;color:var(--muted)">Select a driver</span>
        <button data-mode="CONSERVE">Conserve</button><button data-mode="BALANCED">Balanced</button><button data-mode="PUSH">Push</button>
      </div>
      <div class="row"><span style="min-width:90px;color:var(--muted)">pit:</span>
        <button data-box="SOFT" title="Box at the end of this lap for softs">Box S</button><button data-box="MEDIUM">Box M</button><button data-box="HARD">Box H</button>
        <button id="stayOut" title="Cancel the stop called for this lap">Stay out</button>
        <button id="aiStrategy" title="Hand pit decisions back to the baseline strategy (it replans)">Baseline strategy</button>
      </div>
      <div class="row" id="stratLine" style="color:var(--muted)"></div>
    </div>
    <div class="log" id="log"></div>
    <footer id="footer"></footer>
  </aside>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d");
let track = null, view = null, selected = null, mode = "FREE_SIMULATION";
let prev = new Map(), curr = new Map(), heading = new Map(), lastPoll = performance.now();
let spriteSrc = null; const spriteCache = new Map();
const POLL_MS = 100;
const CAR_LENGTH_M = 5.6, TRACK_WIDTH_M = 14, MIN_CAR_PX = 22, MAX_CAR_PX = 90;
const BATTLE_PX_PER_M = 7;          // battle cam scale: a car is ~40 px, ~200 m of track on screen
const SIM_SPEEDS = [1, 2, 5, 10, 25], REPLAY_SPEEDS = [1, 2, 5, 10, 25, 50];

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
  return res.json();
}
async function command(body) {
  try {
    const ack = await api("/api/debug/command", { idempotency_key: crypto.randomUUID(), ...body });
    const at = ack.applied_tick != null ? `tick ${ack.applied_tick}` : `${fmtClock(ack.replay_s)}`;
    $("msg").textContent = ack.accepted ? `${ack.type} applied at ${at}${ack.snapshot_id ? " · saved " + ack.snapshot_id : ""}` : `${ack.type} rejected: ${ack.reason}`;
  } catch (e) { $("msg").textContent = String(e); }
}

// --- camera -----------------------------------------------------------------------------------
// World metres are rotated by the track's display rotation; the camera looks at a point (cx, cy)
// in that rotated frame with a zoom on top of the "whole track" base scale.
const cam = { cx: 0, cy: 0, zoom: 1, target: null, follow: null, battle: false };
let base = null;   // { scale, cx, cy } that fits the whole track
let W = 0, H = 0;
const rotate = ([x, y], deg) => { const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; };
const pxPerM = () => base.scale * cam.zoom;
function toScreen(p) { const [x, y] = rotate(p, track.rotation_deg); return [W / 2 + (x - cam.cx) * pxPerM(), H / 2 - (y - cam.cy) * pxPerM()]; }
function toRotWorld(sx, sy) { return [cam.cx + (sx - W / 2) / pxPerM(), cam.cy - (sy - H / 2) / pxPerM()]; }

function resize() {
  const dpr = window.devicePixelRatio || 1; W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!track || W < 200 || H < 200) return;   // hidden/collapsed pane: keep the last good scale
  const pts = track.outline.map((p) => rotate(p, track.rotation_deg));
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 70;
  base = { scale: Math.min((W - 2 * pad) / (maxX - minX), (H - 2 * pad) / (maxY - minY)), cx: (minX + maxX) / 2, cy: (minY + maxY) / 2 };
  if (!cam.follow && cam.zoom === 1) { cam.cx = base.cx; cam.cy = base.cy; }
}
function camFit() { if (!base) return; cam.follow = null; cam.battle = false; cam.target = null; cam.zoom = 1; cam.cx = base.cx; cam.cy = base.cy; }
function zoomBy(f, sx = W / 2, sy = H / 2) {
  if (!base) return;
  const before = toRotWorld(sx, sy);
  cam.zoom = Math.min(80, Math.max(1, cam.zoom * f)); cam.target = null; cam.battle = cam.battle && cam.zoom > 3;
  if (!cam.follow) { const after = toRotWorld(sx, sy); cam.cx += before[0] - after[0]; cam.cy += before[1] - after[1]; }
}
function camFollow(battle) {
  if (!base) return;
  const id = selected || (view && view.cars[0] && view.cars[0].driver_id);
  if (!id) return;
  selected = id; cam.follow = id; cam.battle = battle;
  cam.target = battle ? BATTLE_PX_PER_M / base.scale : null;
  render();
}
function camLabel() {
  const code = cam.follow && view ? (view.cars.find((c) => c.driver_id === cam.follow) || {}).code : null;
  $("camLabel").textContent = code ? `${cam.battle ? "Battle cam" : "Following"} ${code} · x${cam.zoom.toFixed(1)}` : cam.zoom === 1 ? "Camera: whole track" : `Camera: free · x${cam.zoom.toFixed(1)}`;
  $("camFollow").classList.toggle("on", !!cam.follow && !cam.battle);
  $("camBattle").classList.toggle("on", !!cam.follow && cam.battle);
}

// --- sprites ------------------------------------------------------------------------------------
// Recolour the base sprite: background -> transparent, bodywork -> team colour (exact match).
function teamSprite(hex) {
  if (!spriteSrc) return null;
  if (spriteCache.has(hex)) return spriteCache.get(hex);
  const { img, paint, bg } = spriteSrc;
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
  const g = c.getContext("2d"); g.drawImage(img, 0, 0);
  const data = g.getImageData(0, 0, c.width, c.height), px = data.data;
  const team = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16));
  for (let i = 0; i < px.length; i += 4) {
    if (px[i] === bg[0] && px[i + 1] === bg[1] && px[i + 2] === bg[2]) px[i + 3] = 0;
    else if (px[i] === paint[0] && px[i + 1] === paint[1] && px[i + 2] === paint[2]) [px[i], px[i + 1], px[i + 2]] = team;
  }
  g.putImageData(data, 0, 0); spriteCache.set(hex, c); return c;
}

// --- drawing ------------------------------------------------------------------------------------
function drawTrack() {
  const path = new Path2D();
  track.outline.forEach((p, i) => { const [x, y] = toScreen(p); i ? path.lineTo(x, y) : path.moveTo(x, y); });
  path.closePath();
  const w = Math.max(12, TRACK_WIDTH_M * pxPerM());
  ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.strokeStyle = getCss("--track-edge"); ctx.lineWidth = w + 4; ctx.stroke(path);
  ctx.strokeStyle = getCss("--track"); ctx.lineWidth = w; ctx.stroke(path);
  const [sx, sy] = toScreen(track.outline[0]), [nx, ny] = toScreen(track.outline[1]);
  const ang = Math.atan2(ny - sy, nx - sx) + Math.PI / 2, half = w / 2 + 2;
  ctx.strokeStyle = "#fff"; ctx.lineWidth = Math.max(3, 1.2 * pxPerM()); ctx.beginPath();
  ctx.moveTo(sx - half * Math.cos(ang), sy - half * Math.sin(ang)); ctx.lineTo(sx + half * Math.cos(ang), sy + half * Math.sin(ang)); ctx.stroke();
  ctx.font = "11px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const c of track.corners) {
    const off = rotate([60, 0], c.angle_deg);
    const [x, y] = toScreen([c.x_m + off[0], c.y_m + off[1]]);
    if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
    ctx.fillStyle = "#2a2f3a"; ctx.beginPath(); ctx.arc(x, y, 9, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = "#c9ced6"; ctx.fillText(String(c.number) + (c.letter || ""), x, y);
  }
}

// Interpolated world positions for this frame (display only; never sent back).
function framePositions(alpha) {
  const out = new Map();
  if (!view) return out;
  for (const car of view.cars) {
    const a = prev.get(car.driver_id), b = curr.get(car.driver_id);
    if (!b) continue;
    const jump = a ? Math.hypot(b[0] - a[0], b[1] - a[1]) : 0;
    out.set(car.driver_id, !a || jump > 400 || view.status !== "RUNNING" ? b : [a[0] + (b[0] - a[0]) * alpha, a[1] + (b[1] - a[1]) * alpha]);
  }
  return out;
}

// Cars a few metres apart sit on the same line: shift them sideways (display only, plan §7.4).
function spread(positions) {
  const placed = [], out = new Map(), minGap = CAR_LENGTH_M * 1.6, lateral = TRACK_WIDTH_M * 0.27;
  for (const car of view.cars) {
    const p = positions.get(car.driver_id); if (!p || car.status === "RETIRED") continue;
    const h = (heading.get(car.driver_id) || 0) * Math.PI / 180, nx = -Math.sin(h), ny = Math.cos(h);
    let q = p;
    for (const k of [0, 1, -1]) {
      const cand = [p[0] + k * lateral * nx, p[1] + k * lateral * ny];
      if (placed.every((o) => Math.hypot(o[0] - cand[0], o[1] - cand[1]) >= minGap)) { q = cand; break; }
      q = cand;
    }
    placed.push(q); out.set(car.driver_id, q);
  }
  return out;
}

function drawCars(positions) {
  if (!view) return;
  const carPx = Math.min(MAX_CAR_PX, Math.max(MIN_CAR_PX, CAR_LENGTH_M * pxPerM()));
  const zoomedIn = pxPerM() > 1.5;
  ctx.font = `bold ${zoomedIn ? 12 : 10}px system-ui`; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  for (const car of [...view.cars].reverse()) {
    const p = positions.get(car.driver_id); if (!p) continue;
    const [x, y] = toScreen(p);
    if (x < -carPx || y < -carPx || x > W + carPx || y > H + carPx) continue;
    const sprite = teamSprite(car.team_color), isSel = car.driver_id === selected;
    if (isSel) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, carPx * 0.62, 0, 2 * Math.PI); ctx.stroke(); }
    if (sprite) {
      const ang = -((heading.get(car.driver_id) || 0) + track.rotation_deg) * Math.PI / 180 + Math.PI / 2;
      ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.imageSmoothingEnabled = false;
      ctx.drawImage(sprite, -carPx / 2, -carPx / 2, carPx, carPx); ctx.restore();
    } else {
      ctx.fillStyle = "#" + car.team_color; ctx.strokeStyle = "#0f1115"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
    }
    const label = zoomedIn ? `P${car.position} ${car.code}` : car.code;
    const tw = ctx.measureText(label).width, lx = x + carPx * 0.55, ly = y - carPx * 0.35;
    ctx.fillStyle = "rgba(15,17,21,.75)"; ctx.fillRect(lx - 3, ly - 8, tw + 6, 16);
    ctx.fillStyle = isSel ? "#fff" : "#e6e8eb"; ctx.fillText(label, lx, ly);
  }
}

// Time-based easing: smooth at 60 fps, and still converges when the browser throttles frames.
let lastFrame = performance.now();
const ease = (dt, tauMs) => 1 - Math.exp(-dt / tauMs);
function frame() {
  const now = performance.now(), dt = Math.min(now - lastFrame, 1000); lastFrame = now;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (track && base) {
    const shown = view ? spread(framePositions(Math.min(1, (now - lastPoll) / POLL_MS))) : new Map();
    if (cam.target) {
      cam.zoom += (cam.target - cam.zoom) * ease(dt, 180);
      if (Math.abs(cam.target - cam.zoom) < 0.01 * cam.target) { cam.zoom = cam.target; cam.target = null; }
    }
    if (cam.follow && shown.has(cam.follow)) {
      const [tx, ty] = rotate(shown.get(cam.follow), track.rotation_deg), k = ease(dt, cam.zoom > 3 ? 60 : 120);
      cam.cx += (tx - cam.cx) * k; cam.cy += (ty - cam.cy) * k;
    }
    drawTrack(); drawCars(shown); camLabel();
  }
  requestAnimationFrame(frame);
}

// --- panel --------------------------------------------------------------------------------------
const fmtClock = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
const fmtLap = (s) => (s == null ? "–" : `${Math.floor(s / 60)}:${(s % 60).toFixed(3).padStart(6, "0")}`);
function gapText(c) {
  if (c.position === 1) return "Leader";
  if (c.status === "RETIRED") return "OUT";
  if (c.laps_down) return `+${c.laps_down} lap${c.laps_down > 1 ? "s" : ""}`;
  return c.gap_to_leader_s == null ? "–" : "+" + c.gap_to_leader_s.toFixed(1);
}
function setMode(m) {
  mode = m; const replay = m === "HISTORICAL_REPLAY";
  document.querySelectorAll(".sim-only").forEach((el) => (el.hidden = replay));
  document.querySelectorAll(".replay-only").forEach((el) => (el.hidden = !replay));
  const ev = (replay && view && view.world_id ? view.world_id : "2024_italian_gp").replace(/_/g, " ").toUpperCase();
  $("title").textContent = replay ? `${ev} · REAL RACE REPLAY` : "MONZA 2024 · ALTERNATE SIMULATION";
  $("badge").innerHTML = replay
    ? '<b class="hist">RECORDED HISTORY</b> · real 2024 lap times from the timing feed · positions interpolated within each lap'
    : "<b>DEBUG VIEWER</b> · read-only view of backend state · positions interpolated on the FastF1 outline";
  $("clockLabel").firstChild.textContent = replay ? "Race " : "Sim ";
  $("modeHead").textContent = replay ? "Lap type" : "Mode";
  $("footer").textContent = (replay ? "Recorded race (FastF1/F1 timing) · no simulation"
    : "Synthetic, uncalibrated lap model · pit stops + baseline strategy · no traffic/SC yet") + " · Space play/pause · → step · wheel zoom · drag pan · F follow · B battle cam · Esc fit"
    + (track && track.car_sprite ? " · " + track.car_sprite.credit : "");
  $("speeds").innerHTML = (replay ? REPLAY_SPEEDS : SIM_SPEEDS).map((s) => `<button data-speed="${s}">x${s}</button>`).join(" ");
  document.querySelectorAll("[data-speed]").forEach((b) => (b.onclick = () => command({ type: "SET_SPEED", speed: Number(b.dataset.speed) })));
  $("seek").max = view ? view.total_laps : 53;
}
function render() {
  if (!view) return;
  $("pill").textContent = view.status; $("pill").className = "pill " + view.status;
  $("lap").textContent = `${view.leader_lap}/${view.total_laps}`;
  $("clock").textContent = fmtClock(view.sim_clock_s); $("tick").textContent = view.tick ?? "–"; $("speed").textContent = view.speed;
  $("seed").textContent = view.seed ?? "–";
  $("play").textContent = { CREATED: "Start", RUNNING: "Pause", PAUSED: "Resume", COMPLETED: "Finished" }[view.status];
  document.querySelectorAll("[data-speed]").forEach((b) => b.classList.toggle("on", Number(b.dataset.speed) === view.speed));
  if (document.activeElement !== $("seek")) { $("seek").value = view.leader_lap; $("seekLabel").textContent = view.leader_lap; }
  $("rows").innerHTML = view.cars.map((c) => {
    const sim = mode !== "HISTORICAL_REPLAY";
    const pit = c.pace_mode === "IN LAP" || c.pace_mode === "OUT LAP" || (sim && c.status === "RUNNING" && (c.in_pit || c.box));
    let modeTxt = !sim ? (c.status === "FINISHED" ? "🏁" : c.pace_mode) : (c.pace_mode === c.lap_pace_mode ? c.pace_mode : c.lap_pace_mode + "→" + c.pace_mode);
    if (sim && c.status === "RUNNING" && c.in_pit) modeTxt = "PIT";
    else if (sim && c.status === "RUNNING" && c.box) modeTxt = `BOX → ${c.box[0]}`;
    return `<tr data-id="${c.driver_id}" class="${c.driver_id === selected ? "sel" : ""} ${c.status === "RETIRED" ? "out" : ""}">
      <td>${c.position}</td>
      <td><span class="chip" style="background:#${c.team_color}"></span>${c.code}${c.result_note ? ` <span class="note" title="Official classification differs from the road result">${c.result_note}</span>` : ""}</td>
      <td>${gapText(c)}</td>
      <td>${c.status === "FINISHED" ? "🏁" : c.status === "RETIRED" ? "DNF" : c.lap}</td>
      <td><span class="tyre ${c.compound}" title="${c.compound}, ${c.tyre_age_laps} laps">${(c.compound || "?")[0]}</span> ${c.tyre_age_laps}</td>
      ${sim ? `<td title="${c.controller === "USER" ? "user strategy" : "baseline plan: " + c.plan}">${c.pit_stops}${c.controller === "USER" ? "ᵁ" : ""}</td>` : ""}
      <td class="mode ${pit ? "pit" : c.pace_mode}">${modeTxt}</td>
      <td>${fmtLap(c.last_lap_time_s)}</td></tr>`;
  }).join("");
  const sel = view.cars.find((c) => c.driver_id === selected);
  $("selname").textContent = sel ? `${sel.code} pace:` : "Select a driver";
  $("stratLine").textContent = !sel ? "" : sel.controller === "USER"
    ? `${sel.code}: user strategy${sel.box ? " · boxing this lap for " + sel.box : ""}`
    : `${sel.code}: baseline plan ${sel.plan}`;
  $("log").innerHTML = [...view.events].reverse().map((e) => {
    const who = view.cars.find((c) => c.driver_id === e.driver_id)?.code || e.driver_id || "";
    const p = e.payload;
    const txt = e.type === "LAP_COMPLETED" ? `lap ${p.lap} ${fmtLap(p.lap_time_s)}`
      : e.type === "PACE_MODE_CHANGED" ? `${p.from}→${p.to} from lap ${p.effective_from_lap}`
      : e.type === "PIT_STOP" ? `lap ${p.lap} ${p.from_compound}→${p.to_compound} after ${p.tyre_age_laps} laps · ${p.standstill_s.toFixed(1)} s stationary, ${p.pit_loss_s.toFixed(1)} s total`
      : e.type === "PIT_REQUESTED" || e.type === "PIT_CANCELLED" ? `${p.compound} at end of lap ${p.in_lap}`
      : e.type === "STRATEGY_PLANNED" ? p.plan
      : e.type === "CONTROLLER_CHANGED" ? `${p.from}→${p.to}`
      : e.type === "CAR_FINISHED" ? `${p.laps} laps`
      : p.detail ?? JSON.stringify(p);
    const when = e.tick != null ? `t${e.tick}` : `lap ${p.lap}`;
    return `<div>${when} · ${who} ${e.type} ${txt}</div>`;
  }).join("");
}
async function poll() {
  try {
    const next = await api("/api/debug/state");
    if ((next.mode || "FREE_SIMULATION") !== mode || !view) { view = next; setMode(next.mode || "FREE_SIMULATION"); }
    prev = curr; curr = new Map(next.cars.map((c) => [c.driver_id, [c.x, c.y]]));
    heading = new Map(next.cars.map((c) => [c.driver_id, c.heading_deg]));
    view = next; lastPoll = performance.now(); render();
  } catch (e) { $("msg").textContent = "backend unreachable: " + e; }
  setTimeout(poll, POLL_MS);
}

// --- wiring -------------------------------------------------------------------------------------
function togglePlay() {
  if (!view) return;
  const t = { CREATED: "START", RUNNING: "PAUSE", PAUSED: "RESUME" }[view.status];
  if (t) command({ type: t });
}
$("play").onclick = togglePlay;
$("save").onclick = () => command({ type: "SAVE" });
document.querySelectorAll("[data-step]").forEach((b) => (b.onclick = () => command({ type: "STEP", ticks: Number(b.dataset.step) })));
document.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => selected && command({ type: "SET_PACE_MODE", driver_id: selected, pace_mode: b.dataset.mode })));
document.querySelectorAll("[data-box]").forEach((b) => (b.onclick = () => selected && command({ type: "PIT_REQUEST", driver_id: selected, compound: b.dataset.box })));
$("stayOut").onclick = () => selected && command({ type: "PIT_CANCEL", driver_id: selected });
$("aiStrategy").onclick = () => selected && command({ type: "SET_CONTROLLER", driver_id: selected, controller: "BASELINE" });
$("seek").oninput = () => ($("seekLabel").textContent = $("seek").value);
$("seek").onchange = () => command({ type: "SEEK", lap: Number($("seek").value) });
async function restart(body, label) {
  if (!confirm(`${label}? The current race keeps running only in its saves.`)) return;
  try { const r = await api("/api/debug/restart", body); prev = new Map(); curr = new Map(); $("msg").textContent = `${label}: ${r.world_id}, seed ${r.seed}. Press Start.`; }
  catch (e) { $("msg").textContent = String(e); }
}
$("restart").onclick = () => restart({}, "Restart with the same seed");
$("newrace").onclick = () => restart({ new_seed: true }, "New race with a new seed");
$("rows").onclick = (e) => { const tr = e.target.closest("tr"); if (tr) { selected = tr.dataset.id; if (cam.follow) cam.follow = selected; render(); } };
$("camFit").onclick = camFit; $("camIn").onclick = () => zoomBy(1.5); $("camOut").onclick = () => zoomBy(1 / 1.5);
$("camFollow").onclick = () => camFollow(false); $("camBattle").onclick = () => camFollow(true);

function carAt(mx, my) {
  if (!view) return null;
  const shown = spread(framePositions(1)); let best = null, bestD = 18;
  for (const c of view.cars) { const p = shown.get(c.driver_id); if (!p) continue; const [x, y] = toScreen(p); const d = Math.hypot(x - mx, y - my); if (d < bestD) { best = c; bestD = d; } }
  return best;
}
let drag = null;
canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, moved: false }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true; canvas.classList.add("dragging");
  cam.follow = null; cam.battle = false;
  cam.cx -= dx / pxPerM(); cam.cy += dy / pxPerM(); drag.x = e.clientX; drag.y = e.clientY;
});
canvas.addEventListener("pointerup", (e) => {
  const r = canvas.getBoundingClientRect();
  if (drag && !drag.moved) { const c = carAt(e.clientX - r.left, e.clientY - r.top); if (c) { selected = c.driver_id; if (cam.follow) cam.follow = selected; render(); } }
  drag = null; canvas.classList.remove("dragging");
});
canvas.addEventListener("dblclick", (e) => {
  const r = canvas.getBoundingClientRect(), c = carAt(e.clientX - r.left, e.clientY - r.top);
  if (c) { selected = c.driver_id; camFollow(true); }
});
canvas.addEventListener("wheel", (e) => {
  e.preventDefault(); const r = canvas.getBoundingClientRect();
  zoomBy(Math.pow(1.0015, -e.deltaY), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); togglePlay(); }
  else if (e.code === "ArrowRight") command({ type: "STEP", ticks: e.shiftKey ? 168 : 1 });
  else if (e.key === "f" || e.key === "F") camFollow(false);
  else if (e.key === "b" || e.key === "B") camFollow(true);
  else if (e.key === "Escape" || e.key === "0") camFit();
  else if (e.key === "+" || e.key === "=") zoomBy(1.5);
  else if (e.key === "-") zoomBy(1 / 1.5);
});
function getCss(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
// Observe the canvas itself: covers window resizes AND tabs/panes that open hidden or small.
new ResizeObserver(() => {
  const keep = base && cam.zoom !== 1 ? { rel: cam.zoom * base.scale } : null;
  resize();
  if (keep && base) cam.zoom = Math.max(1, keep.rel / base.scale);   // keep the same metres-per-pixel
  if (cam.battle && base) cam.zoom = BATTLE_PX_PER_M / base.scale;
}).observe(canvas);

(async () => {
  track = await api("/api/debug/track");
  if (track.car_sprite) {
    const img = new Image();
    img.onload = () => { spriteSrc = { img, paint: track.car_sprite.paint_rgb, bg: track.car_sprite.background_rgb }; spriteCache.clear(); };
    img.src = track.car_sprite.url;
  }
  resize(); camFit(); requestAnimationFrame(frame); poll();
})();
</script>

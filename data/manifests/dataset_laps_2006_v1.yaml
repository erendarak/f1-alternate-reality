dataset_id: laps_2006_v1
dataset_version: 1
feature_schema_version: 1
season: 2006
license_review_status: research_only (F1 timing data via FastF1; not redistributed)
built_by: scripts/build_lap_dataset.py
file:
  relative_path: data/processed/datasets/laps_2006_v1.parquet
  sha256: sha256:8d15cdf6ba4e8d1ef733a7f6f9710937500e0dabd7df3d9d01d2ad678e3fc007
  content_sha256: sha256:21fa0d50fa6846d0faabe14f4cfed0dc906ad1bc6319874d6641815f378574ac
  rows: 19920
  representative_rows: 17554
target: lap_time_s
features:
- name: circuit_id
  available: pre_race
  source_type: historical_verified
  description: Jolpica circuit id
- name: driver_id
  available: pre_race
  source_type: historical_verified
  description: season-specific driver id (roster)
- name: team_id
  available: pre_race
  source_type: historical_verified
  description: team id (roster)
- name: grid_position
  available: pre_race
  source_type: historical_verified
  description: official starting slot (0 = pit lane)
- name: scheduled_laps
  available: pre_race
  source_type: historical_verified
  description: race distance in laps (winner's laps)
- name: lap_number
  available: lap_start
  source_type: historical_verified
  description: 1-based lap number
- name: laps_remaining
  available: lap_start
  source_type: estimated_from_data
  description: 'scheduled_laps - lap_number + 1 (fuel proxy); refuelling era: laps left in the stint'
- name: compound
  available: lap_start
  source_type: historical_verified
  description: tyre compound on this lap
- name: tyre_age_start
  available: lap_start
  source_type: estimated_from_data
  description: laps already on the set when the lap starts
- name: fresh_tyre
  available: lap_start
  source_type: historical_verified
  description: the set was new when fitted (FastF1 FreshTyre)
- name: stint
  available: lap_start
  source_type: historical_verified
  description: stint number
- name: stint_lap
  available: lap_start
  source_type: estimated_from_data
  description: 1-based lap index within the stint
- name: pit_out_lap
  available: lap_start
  source_type: historical_verified
  description: the lap starts in the pit lane
- name: pit_in_lap
  available: decision
  source_type: historical_verified
  description: the car boxes at the end of this lap
- name: position_start
  available: lap_start
  source_type: historical_verified
  description: position when the lap starts (grid on lap 1)
- name: gap_ahead_s
  available: lap_start
  source_type: estimated_from_data
  description: seconds behind the car that crossed the line just before, same lap (NaN on lap 1)
- name: gap_behind_prev_s
  available: lap_start
  source_type: estimated_from_data
  description: seconds ahead of the next car at the PREVIOUS line crossing (the gap to the car behind
    at this crossing isn't known yet when the lap starts; found by the leakage audit)
- name: track_status_start
  available: lap_start
  source_type: historical_verified
  description: track status code when the lap starts
- name: air_temp_c
  available: lap_start
  source_type: historical_verified
  description: latest weather sample at lap start
- name: track_temp_c
  available: lap_start
  source_type: historical_verified
  description: latest weather sample at lap start
- name: humidity_pct
  available: lap_start
  source_type: historical_verified
  description: latest weather sample at lap start
- name: rainfall_start
  available: lap_start
  source_type: historical_verified
  description: rain flag of the latest weather sample
- name: wind_speed_ms
  available: lap_start
  source_type: historical_verified
  description: latest weather sample at lap start
lap_facts_never_features:
- lap_status
- position_end
- is_accurate
- deleted
- fastf1_generated
- representative
leakage_audit: tests/unit/test_lap_dataset.py::test_no_feature_uses_anything_after_the_lap_starts
excluded_quality_fail: {}
splits:
  rule: wet = any intermediate/wet tyre lap or rain at >= 5% of lap starts; among dry races, rounds divisible
    by 4 are held out (dry_test), the rest are dry_train; leave-one-race-out folds run over dry_train.
    Rule fixed before any model was fitted.
  wet:
  - 2006_hungarian_gp
  - 2006_chinese_gp
  dry_test:
  - 2006_san_marino_gp
  - 2006_british_gp
  - 2006_german_gp
  dry_train:

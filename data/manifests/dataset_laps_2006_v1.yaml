  - 2006_malaysian_gp
  - 2006_australian_gp
  - 2006_european_gp
  - 2006_spanish_gp
  - 2006_monaco_gp
  - 2006_canadian_gp
  - 2006_united_states_gp
  - 2006_french_gp
  - 2006_turkish_gp
  - 2006_italian_gp
  - 2006_japanese_gp
  - 2006_brazilian_gp

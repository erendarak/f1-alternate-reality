# Driver persona seed for the whole 2024 season (M4): used for every 2024 race that has no
# race-specific seed file (Monza and Spa keep theirs; the values are identical).
#
# Identity (name, number, team, grid) comes from each race's roster in configs/rosters/
# (historical_verified, Jolpica-F1). The NUMBERS BELOW ARE EDITORIAL ASSUMPTIONS: illustrative
# simulation personas, not verified psychometrics, telemetry or official ratings.
#
# A driver's persona belongs to the driver, not the race: the entries are copied verbatim from
# seed_2024_monza_drivers.yaml, plus Logan Sargeant (from the Spa seed) and the three 2024 drivers
# who raced neither Monza nor Spa (Oliver Bearman, Liam Lawson, Jack Doohan), template-only
# (generic_rookie, confidence 0.15). A race loads only the drivers of its roster.
# Editing any value must create a new profile_revision (and, once worlds exist, a fork).
schema_version: 1
season: 2024
event_id: 2024_season
explanation: "Illustrative simulation persona; not verified driver psychometrics."
profile_revision: v1
policy:
  type: profile_conditioned_baseline
  version: untrained

